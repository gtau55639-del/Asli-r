services:
  - type: web
    name: botlaunch-ai
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: BOTLAUNCH_STORAGE
        value: /tmp/botlaunch
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ENABLE_RUNNER
        value: "true"
      - key: MAX_RUNNING_BOTS
        value: "1"
      - key: BOT_MEMORY_MB
        value: "256"
